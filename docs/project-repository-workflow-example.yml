name: Publish project to portfolio

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse README
        id: readme
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const markdown = fs.readFileSync(path.join(process.cwd(), 'README.md'), 'utf8');

          const extractSection = (heading) => {
            const regex = new RegExp(`##\\s*${heading}\\s*\\n([\\s\\S]*?)(?=\\n##\\s+|\\n#\\s+|$)`, 'i');
            const match = markdown.match(regex);
            return match ? match[1].trim() : '';
          };

          const parseStack = () => {
            const block = extractSection('Stack') || extractSection('Technologies') || '';
            return block.split('\n').map((line) => line.trim()).filter((line) => line.startsWith('- ')).map((line) => line.replace(/^-\s*/, '').trim()).filter(Boolean);
          };

          const parseLinks = () => {
            const live = markdown.match(/Live:\s*(https?:\/\/[^\s]+)/i)?.[1] || '';
            const repo = markdown.match(/GitHub:\s*(https?:\/\/github\.com\/[^\s]+)/i)?.[1] || '';
            return { live, repo };
          };

          const title = markdown.match(/^#\s+(.+)$/m)?.[1]?.trim() || 'Projet sans titre';
          const summary = markdown.split('\n').find((line) => line.startsWith('> '))?.replace(/^>\s*/, '').trim() || 'Projet ajouté automatiquement.';
          const impact = extractSection('Impact') || extractSection('Résultat') || summary;
          const links = parseLinks();
          const image = markdown.match(/!\[[^\]]*\]\((https?:\/\/[^\s)]+|\.\/[^\s)]+|\.\.\/[^\s)]+)\)/i)?.[1] || '/assets/Images/Project.svg';

          const payload = {
            title,
            slug: title.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''),
            category: 'Web',
            summary,
            impact,
            stack: parseStack(),
            image,
            liveUrl: links.live,
            repoUrl: links.repo || `https://github.com/${process.env.GITHUB_REPOSITORY}`,
            featured: true
          };

          const json = JSON.stringify(payload);
          require('fs').appendFileSync(process.env.GITHUB_OUTPUT, `payload=${json}\n`);
          NODE

      - name: Send payload to portfolio repo
        env:
          PORTFOLIO_REPO: grimael/grimus
          PORTFOLIO_TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}
        run: |
          if [ -z "$PORTFOLIO_TOKEN" ]; then
            echo "Missing PORTFOLIO_TOKEN secret."
            exit 1
          fi
          curl \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PORTFOLIO_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/$PORTFOLIO_REPO/dispatches \
            -d '{"event_type":"project-published","client_payload":'"${{ steps.readme.outputs.payload }}"'}'
