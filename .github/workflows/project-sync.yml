name: Project sync

on:
  repository_dispatch:
    types: [project-published]
  workflow_dispatch:
    inputs:
      payload:
        description: JSON payload generated by a project repository
        required: false
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync payload into portfolio data
        env:
          PROJECT_PAYLOAD: ${{ github.event.client_payload || github.event.inputs.payload || '{}' }}
        run: node scripts/sync-project.mjs

      - name: Commit generated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/projects.generated.json
          if git diff --cached --quiet; then
            echo "No project data change to commit."
            exit 0
          fi
          git commit -m "chore: sync project payload"
          git push
